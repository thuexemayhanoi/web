name: One-time publish Hanoi cost article image

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-cost-image-once.yml]

permissions:
  contents: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify single WebP asset
        env:
          IMAGE_SOURCE_URL: https://media.base44.com/images/public/6acfc80804d6eabcec511d23/5e73e9f4e_hanoi-motorbike-rental-cost-prices-2026.webp
        run: |
          set -euo pipefail
          target="assets/img/hanoi-motorbike-rental-cost-prices-2026.webp"
          if [ ! -f "$target" ]; then
            curl --fail --location --silent --show-error --retry 3 --max-time 90 "$IMAGE_SOURCE_URL" --output "$target"
          fi
          echo "a44acd1964f934aab6e186a51d540f87411ce28e7898934ed03acda246dca4ef  $target" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/img/hanoi-motorbike-rental-cost-prices-2026.webp')
          data=p.read_bytes()
          assert 100000 <= len(data) <= 300000, f"Image size out of range: {len(data)} bytes"
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', "Not a genuine WebP"
          page=Path('hanoi-motorbike-rental-cost/index.html')
          html=page.read_text(encoding='utf-8')
          marker='    <h2 id="sec-1">The full verified price list</h2>'
          assert html.count(marker) == 1, "Expected exactly one unchanged article heading"
          image_ref='/assets/img/hanoi-motorbike-rental-cost-prices-2026.webp'
          assert html.count(image_ref) <= 1, 'Unexpected duplicate image reference'
          if image_ref not in html:
              fig=(
                '    <figure class="article-feature-image" style="margin:1.25rem 0 1.5rem;">\n'
                '      <img src="'+image_ref+'" width="1536" height="1024" '
                'alt="Illustration of Hanoi motorbike rental costs with scooters near Hoan Kiem Lake" '
                'loading="eager" decoding="async" fetchpriority="high" '
                'style="display:block;width:100%;height:auto;border-radius:12px;">\n'
                '      <figcaption style="font-size:0.875rem;opacity:0.75;margin-top:0.4rem;">'
                'AI-generated illustration. See the verified daily, weekly and monthly rates below.'
                '</figcaption>\n'
                '    </figure>\n\n'
              )
              page.write_text(html.replace(marker,fig+marker),encoding='utf-8')
          PY
      - name: Verify full SEO and website QA
        run: |
          set -euo pipefail
          node tools/build-site.mjs
          node tools/qa-site.mjs
          node tools/seo-audit.mjs
          node tools/qa-seo-guard.mjs
          node tools/build-site.mjs --check
      - name: Commit only the image and hub change, remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "rentbike-seo-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git rm .github/workflows/publish-cost-image-once.yml
          git add assets/img/hanoi-motorbike-rental-cost-prices-2026.webp hanoi-motorbike-rental-cost/index.html
          git diff --cached --check
          git commit -m "media: add optimized Hanoi rental cost image to price hub"
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          parent="$(git rev-parse HEAD^)"
          if [ "$remote" != "$parent" ]; then
            echo "main changed while publishing image; abort stale write"
            exit 1
          fi
          git push origin HEAD:main

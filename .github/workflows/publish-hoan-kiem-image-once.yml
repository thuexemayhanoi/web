name: Publish Hoan Kiem AI editorial illustration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hoan-kiem-image-once.yml'

permissions:
  contents: write

concurrency:
  group: web-article-image-hoan-kiem-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch and validate optimized AI image; insert only into unillustrated article
        env:
          IMAGE_SOURCE_URL: https://media.base44.com/images/public/6acfc80804d6eabcec511d23/847c06ac4_hoan-kiem-motorbike-travel-illustration.webp
        run: |
          set -euo pipefail
          target="assets/img/articles/seo-520-hoan-kiem-rental-planning.webp"
          test ! -e "$target" || { echo "Refusing to replace existing image"; exit 1; }
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$IMAGE_SOURCE_URL" --output "$target"
          echo "bc69fe295087039c0e7b2047b7265f8b8991ac1cf2e6fbb640d4d83a211fb296  $target" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          asset=Path("assets/img/articles/seo-520-hoan-kiem-rental-planning.webp")
          data=asset.read_bytes()
          assert 100_000 <= len(data) <= 300_000, "Invalid WebP size"
          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP", "Not a genuine WebP"
          article=Path("motorbike-rental-hanoi-old-quarter/hoan-kiem-rental-planning/index.html")
          html=article.read_text(encoding="utf-8")
          original_canonical='<link rel="canonical" href="https://app.rentbikehanoi.com/motorbike-rental-hanoi-old-quarter/hoan-kiem-rental-planning/">'
          assert html.count(original_canonical)==1, "Unexpected canonical"
          m=re.search(r"<article\b[^>]*>(.*?)</article>",html,re.I|re.S)
          assert m, "Article missing"
          assert not re.search(r"<img\b",m.group(1),re.I), "Article already has image; do not overwrite"
          h2=re.search(r"(?m)^[ \t]*<h2\b",m.group(1),re.I)
          assert h2,"No H2 in article body"
          image_path="/assets/img/articles/seo-520-hoan-kiem-rental-planning.webp"
          assert image_path not in html,"Duplicate image"
          figure=(
              '<figure class="article-feature-image" style="margin:1.25rem 0 1.5rem;">\n'
              f'  <img src="{image_path}" width="1536" height="1024" alt="AI illustration of parked rental scooters beside Hoan Kiem Lake in central Hanoi" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;border-radius:12px;">\n'
              '  <figcaption style="font-size:0.875rem;opacity:0.75;margin-top:0.4rem;">AI-generated illustration for travel planning, not a photograph of the rental shop or its fleet.</figcaption>\n'
              '</figure>\n'
          )
          idx=m.start(1)+h2.start()
          updated=html[:idx]+figure+html[idx:]
          assert updated.count(image_path)==1
          assert updated.count(original_canonical)==1
          article.write_text(updated,encoding="utf-8")
          report={
            "batch_id":"web-image-hoan-kiem-20261028","status":"PUBLISHED_PENDING_DEPLOY",
            "published_count":1,"source_type":"Original AI-generated editorial illustration, not fleet photograph",
            "published":[{
              "id":"SEO-520","article":str(article),
              "url":"https://app.rentbikehanoi.com/motorbike-rental-hanoi-old-quarter/hoan-kiem-rental-planning/",
              "image_path":image_path,
              "bytes":len(data),
              "sha256":hashlib.sha256(data).hexdigest(),
              "width":1536,"height":1024,
              "alt":"AI illustration of parked rental scooters beside Hoan Kiem Lake in central Hanoi"
            }]
          }
          out=Path("docs/image-batches/hoan-kiem-20261028-report.json")
          assert not out.exists(),"Do not overwrite existing report"
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Validate site and SEO safeguards
        run: |
          set -euo pipefail
          node tools/build-site.mjs
          node tools/qa-site.mjs
          node tools/qa-seo-guard.mjs
          node tools/qa-article-ui.mjs
          node tools/seo-audit.mjs
          node tools/build-site.mjs --check
      - name: Commit verified image, content and report; delete one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rentbike-image-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git rm ".github/workflows/publish-hoan-kiem-image-once.yml"
          git add "assets/img/articles/seo-520-hoan-kiem-rental-planning.webp" "motorbike-rental-hanoi-old-quarter/hoan-kiem-rental-planning/index.html" "docs/image-batches/hoan-kiem-20261028-report.json"
          git diff --cached --check
          git commit -m "media: add original Hoan Kiem illustration to unillustrated SEO-520 guide"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" || { echo "main advanced during batch: stopping without overwrite"; exit 1; }
          git push origin HEAD:main

name: Site Build and QA

on:
  push:
    branches: [main]
    paths-ignore:
      - '_factory/inbox/**'
      - 'data/writer-queue.json'
      - 'data/factory-state.json'
      - 'reports/factory-last-run.json'
  workflow_dispatch:

# Native GitHub Pages deploys the main branch separately; this job checks quality.
permissions:
  contents: read

concurrency:
  group: site-qa-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build shared site shell
        run: node tools/build-site.mjs
      - name: QA site architecture
        run: node tools/qa-site.mjs
      - name: Verify idempotent build
        run: node tools/build-site.mjs --check
      - name: Build search index
        run: node tools/build-search-index.mjs

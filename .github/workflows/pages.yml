name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_factory/inbox/**'
      - 'data/writer-queue.json'
      - 'data/factory-state.json'
      - 'reports/factory-last-run.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-publish-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build shared site shell
        run: node tools/build-site.mjs
      - name: QA site architecture
        run: node tools/qa-site.mjs
      - name: Verify idempotent build
        run: node tools/build-site.mjs --check
      - name: Build search index
        run: node tools/build-search-index.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Continuous Article Factory

on:
  push:
    branches: [main]
    paths:
      - '_factory/inbox/**'
      - 'tools/factory.mjs'
      - '.github/workflows/article-factory.yml'
  schedule:
    # Recovery watchdog for lost or permanently queued push-triggered runs.
    # Offset from :00 to reduce scheduler congestion.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Factory control'
        required: true
        default: 'status'
        type: choice
        options:
          - process
          - refresh-queue
          - pause
          - resume
          - status

# GitHub Pages is deployed by the native branch build, not by this writer hot loop.
permissions:
  contents: write

concurrency:
  group: article-factory-v3
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve action
        id: control
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
          else
            action="process"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Pause
        if: steps.control.outputs.action == 'pause'
        run: node tools/factory.mjs pause

      - name: Resume
        if: steps.control.outputs.action == 'resume'
        run: node tools/factory.mjs resume

      - name: Refresh queue
        if: steps.control.outputs.action == 'refresh-queue'
        run: node tools/factory.mjs refresh-queue

      - name: Status
        if: steps.control.outputs.action == 'status'
        run: node tools/factory.mjs status

      - name: Check recovery backlog
        id: pending
        if: steps.control.outputs.action == 'process'
        shell: bash
        run: |
          node --check tools/factory.mjs
          count="$(node tools/factory.mjs pending-count | tail -n 1)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending/recovery inbox files: $count"

      - name: Process inbox
        id: process
        if: steps.control.outputs.action == 'process' && steps.pending.outputs.count != '0'
        shell: bash
        run: |
          node tools/factory.mjs process --before "${{ github.event.before }}" --after "${{ github.sha }}"
          node tools/build-site.mjs
          node tools/factory.mjs verify-last
          count="$(node tools/factory.mjs published-count | tail -n 1)"
          echo "published=$count" >> "$GITHUB_OUTPUT"

      - name: Build search index
        if: steps.control.outputs.action == 'process' && steps.pending.outputs.count != '0' && steps.process.outputs.published != '0'
        run: node tools/build-search-index.mjs

      - name: Commit factory results
        id: commit
        if: steps.control.outputs.action != 'status' && (steps.control.outputs.action != 'process' || steps.pending.outputs.count != '0')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rentbike-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "factory: ${{ steps.control.outputs.action }} article queue"

          # Never rebase generated state files. If main advanced while this runner
          # was building, discard the stale generated commit and rebuild from the
          # newest main. This prevents JSON merge conflicts and duplicate publishes.
          for attempt in 1 2 3 4; do
            git fetch origin main
            remote="$(git rev-parse origin/main)"
            parent="$(git rev-parse HEAD^)"
            if [ "$remote" = "$parent" ]; then
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "main advanced during publish; rebuilding on latest main (attempt $attempt/4)"
            git reset --hard origin/main
            pending="$(node tools/factory.mjs pending-count | tail -n 1)"
            if [ "$pending" = "0" ]; then
              echo "another runner already consumed the pending inbox; nothing left to publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            node tools/factory.mjs process
            node tools/build-site.mjs
            node tools/factory.mjs verify-last
            published="$(node tools/factory.mjs published-count | tail -n 1)"
            if [ "$published" != "0" ]; then
              node tools/build-search-index.mjs
            fi
            git add -A
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "factory: ${{ steps.control.outputs.action }} article queue"
          done

          echo "factory could not publish after 4 rebuild attempts" >&2
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Continuous Article Factory" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: ${{ steps.control.outputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish commit: ${{ steps.commit.outputs.head }}" >> "$GITHUB_STEP_SUMMARY"
          node tools/factory.mjs status >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop safely if blocked
        if: steps.control.outputs.action == 'process'
        run: node tools/factory.mjs assert-not-blocked

name: One-time publish 50 SEO article illustrations

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-image-batch-001.yml]

permissions:
  contents: write

concurrency:
  group: article-factory-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source image encoder only (no AI API)
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Publish up to 50 distinct attributed illustrative stock photos
        run: python3 tools/publish-image-batch.py
      - name: Verify exact image bytes, article references and SEO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('docs/image-batches/batch-001-report.json').read_text())
          assert 1 <= r['published_count'] <= 50
          assert r['published_count']==len(r['published'])
          assert len({p['photo_id'] for p in r['published']})==r['published_count']
          for p in r['published']:
              f=Path(p['image_path'].lstrip('/'))
              data=f.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert 100_000 <= len(data) <= 300_000
              with Image.open(f) as image:
                  image.verify()
              article=Path(p['article']).read_text(encoding='utf-8')
              assert article.count(p['image_path'])==1
              assert 'Illustrative stock photograph' in article
          print('Verified',r['published_count'],'unique image files and HTML references')
          PY
          node tools/build-site.mjs
          node tools/qa-site.mjs
          node tools/seo-audit.mjs
          node tools/qa-seo-guard.mjs
          node tools/build-site.mjs --check
      - name: Commit verified article images and clean up one-time workflow
        run: |
          set -euo pipefail
          git config user.name "rentbike-seo-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          local="$(git rev-parse HEAD)"
          if [ "$remote" != "$local" ]; then
            echo "main changed while generating; refusing stale commit"
            exit 1
          fi
          git rm .github/workflows/publish-image-batch-001.yml
          git add docs/image-batches/batch-001.json docs/image-batches/batch-001-report.json assets/img/articles/
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path('docs/image-batches/batch-001-report.json').read_text())
          for row in report['published']:
              subprocess.run(['git','add','--',row['article']],check=True)
          PY
          git diff --cached --check
          git commit -m "media: publish verified 50-article WebP batch with Unsplash attribution"
          git push origin HEAD:main

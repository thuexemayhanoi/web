<div class="contact-cta">
      <h3>{{cta.heading}}</h3>
      <p>Call <a href="tel:{{business.phoneTel}}">{{business.phone}}</a>, email <a href="mailto:{{business.email}}">{{business.email}}</a>, or visit us at {{business.addressShort}} &mdash; {{business.hoursDisplay}}.</p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="{{cta.primaryHref}}">{{cta.primaryLabel}}</a>
        <a class="btn btn-secondary" href="{{cta.secondaryHref}}">{{cta.secondaryLabel}}</a>
      </div>
    </div>

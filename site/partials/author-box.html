<section class="post-author" aria-label="About the publisher">
  <img class="post-author-logo" src="{{brand.logoPath}}" width="58" height="58" alt="" loading="lazy" decoding="async">
  <div class="post-author-info">
    <p class="post-author-label">Published by</p>
    <p class="post-author-name"><a href="/">{{business.name}}</a></p>
    <p class="post-author-bio">Motorbike rental guides from our shop at {{business.addressShort}}. For current availability or booking questions, <a href="tel:{{business.phoneTel}}">call {{business.phone}}</a>.</p>
  </div>
</section>

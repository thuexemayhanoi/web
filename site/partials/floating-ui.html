<button class="chat-fab" id="chat-fab" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Open chat assistant">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.5L4 21l1.6-4.4A8.5 8.5 0 1 1 21 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    <span class="chat-title">Hanoi Motorbike Rental Assistant</span>
    <button class="chat-close btn-icon" type="button" aria-label="Close chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>

  <div class="chat-quick">
    <button type="button" data-q="Prices">Prices</button>
    <button type="button" data-q="Monthly motorbike rental prices">Monthly rental</button>
    <button type="button" data-q="50cc rental price">50cc bikes</button>
    <button type="button" data-q="Address">Address</button>
    <button type="button" data-q="Opening hours">Opening hours</button>

</div>
